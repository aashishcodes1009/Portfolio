<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaBoard — Learn a Language</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F3B2E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --board:#1F3B2E;
  --board-dark:#152B20;
  --board-light:#2A4E3B;
  --frame:#6B4A34;
  --frame-dark:#4A3223;
  --frame-light:#8A6647;
  --chalk:#F5F3E7;
  --chalk-dim:#C7CFC5;
  --chalk-yellow:#F2C94C;
  --chalk-coral:#E8776B;
  --chalk-blue:#8FC1DE;
  --shadow:rgba(0,0,0,0.35);
  --radius:14px;
}

*{ box-sizing:border-box; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
}

html,body{
  margin:0;
  padding:0;
  background:var(--frame-dark);
  color:var(--chalk);
  font-family:'Inter', sans-serif;
  min-height:100vh;
}

#app{
  max-width:920px;
  margin:0 auto;
  padding:18px 14px 60px;
}

/* ---------- Header ---------- */
.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:14px 18px;
  margin-bottom:16px;
}

.brand{
  display:flex;
  align-items:baseline;
  gap:10px;
}

.brand h1{
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:2.6rem;
  margin:0;
  color:var(--chalk);
  letter-spacing:0.5px;
  text-shadow:0 0 14px rgba(245,243,231,0.18);
}

.brand .tagline{
  font-size:0.78rem;
  color:var(--chalk-dim);
  font-family:'IBM Plex Mono', monospace;
  letter-spacing:0.04em;
}

.header-right{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}

.streak-badge{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.78rem;
  color:var(--chalk-dim);
  border:1px dashed rgba(245,243,231,0.35);
  border-radius:20px;
  padding:6px 12px;
  white-space:nowrap;
}
.streak-badge b{ color:var(--chalk-yellow); font-weight:600; }

select.lang-select{
  appearance:none;
  background:var(--board-light);
  color:var(--chalk);
  border:1px solid rgba(245,243,231,0.3);
  border-radius:10px;
  padding:8px 32px 8px 14px;
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size:0.9rem;
  cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0 Z' fill='%23F5F3E7'/></svg>");
  background-repeat:no-repeat;
  background-position:right 12px center;
}
select.lang-select:focus-visible{ outline:2px solid var(--chalk-yellow); outline-offset:2px; }

.voice-settings-btn{
  font-size:0.78rem;
  padding:6px 12px;
}

.voice-panel{
  background:var(--board-dark);
  border:1px solid rgba(245,243,231,0.25);
  border-radius:14px;
  padding:16px 18px;
  margin:0 18px 16px;
}
.voice-panel-title{
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:1.3rem;
  color:var(--chalk-yellow);
  margin-bottom:6px;
}
.voice-panel-copy{
  font-size:0.82rem;
  color:var(--chalk-dim);
  line-height:1.5;
  margin:0 0 12px;
}
.voice-panel-copy a{ color:var(--chalk-blue); }
.voice-panel-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.voice-panel-row input{
  flex:1;
  min-width:220px;
  background:rgba(245,243,231,0.06);
  border:1px solid rgba(245,243,231,0.3);
  border-radius:8px;
  padding:9px 12px;
  color:var(--chalk);
  font-family:'IBM Plex Mono', monospace;
  font-size:0.82rem;
}
.voice-panel-row input:focus-visible{ outline:2px solid var(--chalk-yellow); outline-offset:1px; }
.voice-panel-warn{
  font-size:0.72rem;
  color:var(--chalk-coral);
  line-height:1.5;
  margin:0;
}

/* ---------- Board frame ---------- */
.board-frame{
  background:var(--frame);
  background-image:
    linear-gradient(90deg, rgba(0,0,0,0.12), transparent 6%, transparent 94%, rgba(0,0,0,0.12)),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 40px);
  border-radius:20px;
  padding:14px;
  box-shadow:0 18px 40px var(--shadow), inset 0 0 0 1px var(--frame-light);
}

.board{
  background:radial-gradient(circle at 30% 20%, var(--board-light), var(--board) 70%);
  border-radius:12px;
  padding:20px;
  min-height:520px;
  box-shadow:inset 0 0 60px rgba(0,0,0,0.35);
  position:relative;
}

/* ---------- Tabs ---------- */
.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:14px;
  border-bottom:1px dashed rgba(245,243,231,0.25);
}
.tab-btn{
  background:transparent;
  border:none;
  color:var(--chalk-dim);
  font-family:'Caveat', cursive;
  font-size:1.4rem;
  font-weight:600;
  padding:6px 16px;
  cursor:pointer;
  border-radius:8px 8px 0 0;
  white-space:nowrap;
  transition:color 0.15s ease;
}
.tab-btn:hover{ color:var(--chalk); }
.tab-btn.active{
  color:var(--chalk-yellow);
  text-decoration:underline wavy rgba(242,201,76,0.5) 2px;
  text-underline-offset:6px;
}
.tab-btn:focus-visible{ outline:2px solid var(--chalk-yellow); outline-offset:2px; }

/* ---------- Category chips ---------- */
.chip-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.chip{
  background:rgba(245,243,231,0.06);
  border:1px solid rgba(245,243,231,0.25);
  color:var(--chalk-dim);
  font-size:0.8rem;
  font-family:'Inter', sans-serif;
  font-weight:500;
  padding:6px 14px;
  border-radius:20px;
  cursor:pointer;
  transition:all 0.15s ease;
}
.chip:hover{ border-color:var(--chalk-blue); color:var(--chalk); }
.chip.active{
  background:var(--chalk-blue);
  border-color:var(--chalk-blue);
  color:var(--board-dark);
  font-weight:600;
}
.chip:focus-visible{ outline:2px solid var(--chalk-yellow); outline-offset:2px; }

/* ---------- Flashcard ---------- */
.card-stage{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  padding:10px 0 6px;
}

.card-counter{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.78rem;
  color:var(--chalk-dim);
}

.flashcard{
  width:100%;
  max-width:440px;
  height:260px;
  perspective:1200px;
  cursor:pointer;
}
.flashcard-inner{
  position:relative;
  width:100%;
  height:100%;
  transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.flashcard.flipped .flashcard-inner{ transform:rotateY(180deg); }

.flashcard-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:12px;
  border:2px dashed rgba(245,243,231,0.4);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:24px;
  text-align:center;
  background:rgba(245,243,231,0.03);
}
.flashcard-face.back{ transform:rotateY(180deg); }

.face-label{
  position:absolute;
  top:12px;
  left:16px;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.68rem;
  letter-spacing:0.08em;
  color:var(--chalk-dim);
  text-transform:uppercase;
}

.term{
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:2.6rem;
  color:var(--chalk);
  line-height:1.1;
}
.pronunciation{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.95rem;
  color:var(--chalk-blue);
}
.translation{
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:2.2rem;
  color:var(--chalk-yellow);
}
.example{
  font-size:0.85rem;
  color:var(--chalk-dim);
  font-style:italic;
  max-width:340px;
}
.hint{
  font-size:0.72rem;
  color:var(--chalk-dim);
  opacity:0.7;
}

.speaker-btn{
  background:none;
  border:1px solid rgba(245,243,231,0.35);
  border-radius:50%;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:var(--chalk);
}
.speaker-btn:hover{ border-color:var(--chalk-blue); }
.speaker-btn:focus-visible{ outline:2px solid var(--chalk-yellow); outline-offset:2px; }

.card-controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

.btn{
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size:0.85rem;
  padding:10px 18px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  transition:transform 0.1s ease, filter 0.15s ease;
}
.btn:active{ transform:translateY(1px); }
.btn:focus-visible{ outline:2px solid var(--chalk-yellow); outline-offset:2px; }
.btn-ghost{
  background:transparent;
  border:1px solid rgba(245,243,231,0.35);
  color:var(--chalk);
}
.btn-ghost:hover{ border-color:var(--chalk); }
.btn-coral{ background:var(--chalk-coral); color:#3A1410; }
.btn-coral:hover{ filter:brightness(1.08); }
.btn-green{ background:#9FD8A6; color:#123219; }
.btn-green:hover{ filter:brightness(1.08); }
.btn-blue{ background:var(--chalk-blue); color:#0E2A38; }
.btn-blue:hover{ filter:brightness(1.08); }
.btn:disabled{ opacity:0.4; cursor:not-allowed; }

/* chalk dust burst on "Got it" */
.dust-particle{
  position:absolute;
  width:5px; height:5px;
  background:var(--chalk);
  border-radius:50%;
  pointer-events:none;
  opacity:0.9;
  animation:dust-fly 0.7s ease-out forwards;
}
@keyframes dust-fly{
  to{ transform:translate(var(--dx), var(--dy)) scale(0.2); opacity:0; }
}

/* ---------- Progress (eraser bar) ---------- */
.progress-wrap{
  margin-top:22px;
  padding-top:14px;
  border-top:1px dashed rgba(245,243,231,0.25);
}
.progress-label{
  display:flex;
  justify-content:space-between;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.75rem;
  color:var(--chalk-dim);
  margin-bottom:6px;
}
.progress-track{
  position:relative;
  height:16px;
  border-radius:8px;
  overflow:hidden;
  background:
    repeating-linear-gradient(45deg, rgba(245,243,231,0.18) 0 2px, transparent 2px 6px),
    var(--board-dark);
  border:1px solid rgba(245,243,231,0.2);
}
.progress-fill{
  position:absolute;
  left:0; top:0; bottom:0;
  background:linear-gradient(90deg, var(--frame-light), var(--frame));
  transition:width 0.4s ease;
  box-shadow:inset -3px 0 6px rgba(0,0,0,0.25);
}
.progress-fill::after{
  content:"";
  position:absolute;
  right:-2px; top:0; bottom:0;
  width:10px;
  background:rgba(245,243,231,0.5);
  border-radius:2px;
}

/* ---------- Quiz ---------- */
.quiz-question{
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:1.8rem;
  text-align:center;
  color:var(--chalk);
  margin-bottom:6px;
}
.quiz-sub{
  text-align:center;
  font-family:'IBM Plex Mono', monospace;
  font-size:0.75rem;
  color:var(--chalk-dim);
  margin-bottom:20px;
}
.quiz-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  max-width:520px;
  margin:0 auto;
}
@media (max-width:520px){
  .quiz-options{ grid-template-columns:1fr; }
}
.quiz-option{
  background:rgba(245,243,231,0.05);
  border:1px solid rgba(245,243,231,0.3);
  color:var(--chalk);
  font-family:'Inter', sans-serif;
  font-size:0.9rem;
  font-weight:500;
  padding:14px 12px;
  border-radius:10px;
  cursor:pointer;
  text-align:left;
  transition:all 0.15s ease;
}
.quiz-option:hover:not(:disabled){ border-color:var(--chalk-blue); }
.quiz-option:focus-visible{ outline:2px solid var(--chalk-yellow); outline-offset:2px; }
.quiz-option.correct{ background:#9FD8A6; color:#123219; border-color:#9FD8A6; }
.quiz-option.wrong{ background:var(--chalk-coral); color:#3A1410; border-color:var(--chalk-coral); }
.quiz-option:disabled{ cursor:default; }

.quiz-footer{
  display:flex;
  justify-content:center;
  margin-top:20px;
}

.results-wrap{
  text-align:center;
  padding:30px 10px;
}
.results-score{
  font-family:'Caveat', cursive;
  font-weight:700;
  font-size:4rem;
  color:var(--chalk-yellow);
}
.results-sub{
  font-family:'IBM Plex Mono', monospace;
  font-size:0.85rem;
  color:var(--chalk-dim);
  margin-bottom:22px;
}
.results-actions{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

/* ---------- Voice toast ---------- */
.voice-toast{
  position:absolute;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  background:var(--board-dark);
  border:1px solid rgba(245,243,231,0.35);
  color:var(--chalk);
  font-family:'Inter', sans-serif;
  font-size:0.78rem;
  padding:8px 16px;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.35);
  max-width:88%;
  text-align:center;
  animation:toast-fade 3.2s ease forwards;
  z-index:5;
}
@keyframes toast-fade{
  0%{ opacity:0; transform:translate(-50%, 8px); }
  10%{ opacity:1; transform:translate(-50%, 0); }
  85%{ opacity:1; }
  100%{ opacity:0; transform:translate(-50%, 0); }
}

/* ---------- Grammar list ---------- */
.empty-state{
  text-align:center;
  color:var(--chalk-dim);
  font-family:'IBM Plex Mono', monospace;
  font-size:0.85rem;
  padding:40px 10px;
}
</style>
</head>

/* ============ STATE & PERSISTENCE ============ */
const STORAGE_KEY = "linguaboard_progress_v1";

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error("Could not read saved progress", e); }
  return { streak:{lastDate:null, count:0}, langs:{} };
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
  catch(e){ console.error("Could not save progress", e); }
}
function ensureLang(lang){
  if(!progress.langs[lang]) progress.langs[lang] = { known:{}, quizHistory:[], bestScore:0 };
}
function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  const s = progress.streak;
  if(s.lastDate === today) return;
  if(s.lastDate){
    const prev = new Date(s.lastDate);
    const diffDays = Math.round((new Date(today) - prev) / 86400000);
    s.count = diffDays === 1 ? s.count + 1 : 1;
  } else {
    s.count = 1;
  }
  s.lastDate = today;
  saveProgress();
}

let progress = loadProgress();

/* ============ HELPERS ============ */
function allItemsForLang(lang){
  const d = DATA[lang];
  return {
    vocabulary: d.vocabulary.map((it,i)=>({...it, id:`${lang}_vocabulary_${i}`})),
    phrases: d.phrases.map((it,i)=>({...it, id:`${lang}_phrases_${i}`})),
    grammar: d.grammar.map((it,i)=>({...it, id:`${lang}_grammar_${i}`}))
  };
}
function currentDeck(){
  const items = allItemsForLang(state.lang);
  if(state.tab === "vocabulary"){
    const filtered = state.catFilter === "All" ? items.vocabulary : items.vocabulary.filter(v=>v.cat===state.catFilter);
    return filtered;
  }
  if(state.tab === "phrases") return items.phrases;
  if(state.tab === "grammar") return items.grammar;
  return [];
}
function computeProgress(lang){
  const items = allItemsForLang(lang);
  const total = items.vocabulary.length + items.phrases.length + items.grammar.length;
  ensureLang(lang);
  const knownMap = progress.langs[lang].known;
  const known = Object.keys(knownMap).filter(k=>knownMap[k]).length;
  return { known, total, pct: total ? Math.round((known/total)*100) : 0 };
}
function isKnown(id){
  ensureLang(state.lang);
  return !!progress.langs[state.lang].known[id];
}
function markKnown(id, val){
  ensureLang(state.lang);
  progress.langs[state.lang].known[id] = val;
  saveProgress();
  touchStreak();
}
/* Voices load asynchronously in most browsers, so cache and refresh the list */
let cachedVoices = [];
function refreshVoices(){
  try{ cachedVoices = window.speechSynthesis.getVoices(); }catch(e){ cachedVoices = []; }
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

function findVoice(langCode){
  if(!cachedVoices.length) refreshVoices();
  const exact = cachedVoices.find(v => v.lang.toLowerCase() === langCode.toLowerCase());
  if(exact) return exact;
  const base = langCode.split('-')[0].toLowerCase();
  return cachedVoices.find(v => v.lang.toLowerCase().startsWith(base)) || null;
}

/* Returns {ok, mode, reason}. mode is "native" (spoke the actual term) or
   "phonetic" (no native voice, so read the English phonetic guide instead) */
function speak(term, langCode, phoneticGuide){
  if(!('speechSynthesis' in window)) return { ok:false, reason:"unsupported" };

  const nativeVoice = findVoice(langCode);
  if(nativeVoice){
    try{
      const u = new SpeechSynthesisUtterance(term);
      u.lang = langCode;
      u.voice = nativeVoice;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
      return { ok:true, mode:"native" };
    }catch(e){ /* fall through to phonetic fallback below */ }
  }

  // No native voice (common for Nepali, sometimes Hindi) — read the
  // phonetic guide aloud with an English voice instead of staying silent.
  if(phoneticGuide){
    const englishVoice = findVoice("en-US") ||
      cachedVoices.find(v => v.lang.toLowerCase().startsWith("en")) || null;
    if(englishVoice){
      try{
        const spoken = phoneticGuide.replace(/-/g, " ").replace(/\s+/g, " ").trim();
        const u = new SpeechSynthesisUtterance(spoken);
        u.lang = "en-US";
        u.voice = englishVoice;
        u.rate = 0.85; // slightly slower so syllables are distinguishable
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
        return { ok:true, mode:"phonetic" };
      }catch(e){ /* fall through */ }
    }
  }

  return { ok:false, reason:"novoice" };
}

/* Cloud voice via ElevenLabs — used when the user has added their own API
   key. The multilingual model auto-detects the language from the text, so
   the same voice ID works for Spanish, Hindi, Nepali, Japanese, etc. */
async function fetchCloudSpeech(text, apiKey){
  const voiceId = "21m00Tcm4TlvDq8ikWAM"; // ElevenLabs default multilingual voice
  const resp = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
    method: "POST",
    headers: {
      "xi-api-key": apiKey,
      "Content-Type": "application/json",
      "Accept": "audio/mpeg"
    },
    body: JSON.stringify({
      text: text,
      model_id: "eleven_multilingual_v2"
    })
  });
  if(!resp.ok) throw new Error(`Cloud voice request failed (${resp.status})`);
  const blob = await resp.blob();
  return URL.createObjectURL(blob);
}

function showToast(msg){
  const boardEl = document.querySelector(".board");
  if(!boardEl) return;
  const old = boardEl.querySelector(".voice-toast");
  if(old) old.remove();
  const t = document.createElement("div");
  t.className = "voice-toast";
  t.textContent = msg;
  boardEl.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ============ QUIZ LOGIC ============ */
function generateQuiz(lang){
  const items = allItemsForLang(lang);
  const pool = [...items.vocabulary, ...items.phrases];
  const picked = shuffle(pool).slice(0, Math.min(10, pool.length));
  const questions = picked.map(q=>{
    const distractors = shuffle(pool.filter(p=>p.translation!==q.translation)).slice(0,3).map(p=>p.translation);
    const options = shuffle([q.translation, ...distractors]);
    return { term:q.term, pron:q.pron, correct:q.translation, options };
  });
  return { questions, index:0, score:0, answered:false, selected:null };
}

/* ============ RENDER ============ */
function render(){
  const app = document.getElementById("app");
  const langData = DATA[state.lang];
  const prog = computeProgress(state.lang);
  ensureLang(state.lang);

  app.innerHTML = `
    <header class="app-header">
      <div class="brand">
        <h1>LinguaBoard</h1>
        <span class="tagline">learn a little, every day</span>
      </div>
      <div class="header-right">
        <span class="streak-badge">🔥 <b>${progress.streak.count}</b>-day streak</span>
        <button class="btn-ghost voice-settings-btn" id="voiceSettingsBtn" type="button">🔑 Voice</button>
        <select class="lang-select" id="langSelect" aria-label="Choose language">
          ${Object.keys(DATA).map(k=>`<option value="${k}" ${k===state.lang?'selected':''}>${DATA[k].name}</option>`).join('')}
        </select>
      </div>
    </header>

    ${voiceSettingsOpen ? `
    <div class="voice-panel">
      <div class="voice-panel-title">Cloud voice (optional)</div>
      <p class="voice-panel-copy">
        Browsers often lack a real Nepali voice, and Hindi support varies by device.
        Add your own <a href="https://elevenlabs.io" target="_blank" rel="noopener">ElevenLabs</a> API key
        to hear genuine native-quality audio for every language here, instead of the built-in browser voice.
      </p>
      <div class="voice-panel-row">
        <input type="password" id="voiceKeyInput" placeholder="Paste your ElevenLabs API key"
               value="${getVoiceKey() ? '••••••••••••••••' : ''}" />
        <button class="btn btn-blue" id="voiceKeySave" type="button">Save</button>
        <button class="btn btn-ghost" id="voiceKeyClear" type="button">Clear</button>
      </div>
      <p class="voice-panel-warn">
        ⚠️ This key is stored only in this browser's local storage and sent directly to ElevenLabs when you tap 🔊.
        It is <b>not</b> sent anywhere else. If you share this HTML file with someone else, remove your key first —
        anyone with a copy of the file's local storage on their own machine would need to add their own key anyway,
        but never paste a key into a copy of this file you plan to publish or share as source code.
      </p>
    </div>` : ``}

    <div class="board-frame">
      <div class="board">
        <div class="tabs" role="tablist">
          ${["vocabulary","phrases","grammar","quiz"].map(t=>`
            <button class="tab-btn ${state.tab===t?'active':''}" data-tab="${t}" role="tab" aria-selected="${state.tab===t}">
              ${t.charAt(0).toUpperCase()+t.slice(1)}
            </button>`).join('')}
        </div>

        <div id="tabContent"></div>

        ${state.tab !== 'quiz' ? `
        <div class="progress-wrap">
          <div class="progress-label">
            <span>${langData.name} progress</span>
            <span>${prog.known} / ${prog.total} learned (${prog.pct}%)</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${prog.pct}%;"></div>
          </div>
        </div>` : ``}
      </div>
    </div>
  `;

  document.getElementById("langSelect").addEventListener("change", e=>{
    state.lang = e.target.value;
    state.cardIndex = 0;
    state.flipped = false;
    state.catFilter = "All";
    state.quiz = null;
    render();
  });

  document.getElementById("voiceSettingsBtn").addEventListener("click", ()=>{
    voiceSettingsOpen = !voiceSettingsOpen;
    render();
  });

  if(voiceSettingsOpen){
    document.getElementById("voiceKeySave").addEventListener("click", ()=>{
      const input = document.getElementById("voiceKeyInput");
      const val = input.value.trim();
      if(val && val !== "••••••••••••••••"){
        saveVoiceKey(val);
        showToast("Voice key saved — tap 🔊 on any card to try it.");
      }
      render();
    });
    document.getElementById("voiceKeyClear").addEventListener("click", ()=>{
      clearVoiceKey();
      showToast("Voice key removed. Falling back to the built-in browser voice.");
      render();
    });
  }

  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.tab = btn.dataset.tab;
      state.cardIndex = 0;
      state.flipped = false;
      state.catFilter = "All";
      if(state.tab === "quiz") state.quiz = generateQuiz(state.lang);
      render();
    });
  });

  renderTabContent();
}

function renderTabContent(){
  const container = document.getElementById("tabContent");
  if(state.tab === "quiz"){
    renderQuiz(container);
  } else {
    renderFlashcards(container);
  }
}

function renderFlashcards(container){
  const deck = currentDeck();

  let chipsHtml = "";
  if(state.tab === "vocabulary"){
    const cats = ["All", ...new Set(DATA[state.lang].vocabulary.map(v=>v.cat))];
    chipsHtml = `<div class="chip-row">${cats.map(c=>`
      <button class="chip ${state.catFilter===c?'active':''}" data-cat="${c}">${c}</button>
    `).join('')}</div>`;
  }

  if(deck.length === 0){
    container.innerHTML = chipsHtml + `<div class="empty-state">No cards in this category yet.</div>`;
    bindChips(container);
    return;
  }

  if(state.cardIndex >= deck.length) state.cardIndex = 0;
  const item = deck[state.cardIndex];
  const isGrammar = state.tab === "grammar";
  const known = isKnown(item.id);

  container.innerHTML = chipsHtml + `
    <div class="card-stage">
      <div class="card-counter">Card ${state.cardIndex+1} of ${deck.length} ${known ? '· ✓ learned' : ''}</div>

      <div class="flashcard ${state.flipped?'flipped':''}" id="flashcard" tabindex="0" role="button"
           aria-label="Flashcard, press enter or space to flip">
        <div class="flashcard-inner">
          <div class="flashcard-face front">
            <span class="face-label">${isGrammar ? 'grammar point' : 'front'}</span>
            ${isGrammar ? `
              <div class="term" style="font-size:2rem;">${item.title}</div>
              <div class="hint">tap to see the explanation</div>
            ` : `
              <div class="term">${item.term}</div>
              <div class="pronunciation">${item.pron}</div>
              ${!isGrammar ? `<button class="speaker-btn" id="speakBtn" aria-label="Hear pronunciation">🔊</button>` : ``}
              <div class="hint">tap to flip</div>
            `}
          </div>
          <div class="flashcard-face back">
            <span class="face-label">${isGrammar ? 'explanation' : 'translation'}</span>
            ${isGrammar ? `
              <div class="translation" style="font-size:1.5rem;">${item.explanation}</div>
              <div class="example">${item.example}</div>
            ` : `
              <div class="translation">${item.translation}</div>
              <div class="hint">tap to flip back</div>
            `}
          </div>
        </div>
      </div>

      <div class="card-controls">
        <button class="btn btn-ghost" id="prevBtn" ${state.cardIndex===0?'disabled':''}>&larr; Prev</button>
        <button class="btn btn-coral" id="stillBtn">Still learning</button>
        <button class="btn btn-green" id="knowBtn">Got it! ✓</button>
        <button class="btn btn-ghost" id="nextBtn" ${state.cardIndex===deck.length-1?'disabled':''}>Next &rarr;</button>
      </div>
    </div>
  `;

  bindChips(container);

  const flashcardEl = document.getElementById("flashcard");
  const flipCard = ()=>{ state.flipped = !state.flipped; render(); };
  flashcardEl.addEventListener("click", flipCard);
  flashcardEl.addEventListener("keydown", e=>{
    if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flipCard(); }
  });

  const speakBtn = document.getElementById("speakBtn");
  if(speakBtn){
    speakBtn.addEventListener("click", async e=>{
      e.stopPropagation();
      const apiKey = getVoiceKey();

      if(apiKey){
        speakBtn.disabled = true;
        speakBtn.textContent = "⏳";
        try{
          const url = await fetchCloudSpeech(item.term, apiKey);
          const audio = new Audio(url);
          await audio.play();
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊";
          return;
        }catch(err){
          console.error("Cloud voice failed, falling back", err);
          showToast("Cloud voice failed — using the built-in browser voice instead.");
          speakBtn.disabled = false;
          speakBtn.textContent = "🔊";
          // fall through to native/phonetic fallback below
        }
      }

      const result = speak(item.term, DATA[state.lang].speechLang, item.pron);
      if(result.ok && result.mode === "phonetic"){
        showToast(`No ${DATA[state.lang].name} voice on this device — playing the phonetic pronunciation instead.`);
      } else if(!result.ok){
        const msg = result.reason === "unsupported"
          ? "Text-to-speech isn't available in this browser."
          : "No voice available to read this card.";
        showToast(msg);
      }
    });
  }

  document.getElementById("prevBtn").addEventListener("click", ()=>{
    state.cardIndex = Math.max(0, state.cardIndex-1);
    state.flipped = false;
    render();
  });
  document.getElementById("nextBtn").addEventListener("click", ()=>{
    state.cardIndex = Math.min(deck.length-1, state.cardIndex+1);
    state.flipped = false;
    render();
  });
  document.getElementById("stillBtn").addEventListener("click", ()=>{
    markKnown(item.id, false);
    advanceCard(deck);
  });
  document.getElementById("knowBtn").addEventListener("click", (e)=>{
    markKnown(item.id, true);
    burstDust(e.currentTarget);
    advanceCard(deck);
  });
}

function advanceCard(deck){
  if(state.cardIndex < deck.length-1){
    state.cardIndex += 1;
    state.flipped = false;
    render();
  } else {
    render(); // stay on last card, refresh progress bar / known state
  }
}

function bindChips(container){
  container.querySelectorAll(".chip").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      state.catFilter = chip.dataset.cat;
      state.cardIndex = 0;
      state.flipped = false;
      render();
    });
  });
}

function burstDust(anchorEl){
  const rect = anchorEl.getBoundingClientRect();
  const boardEl = document.querySelector(".board");
  const boardRect = boardEl.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const p = document.createElement("span");
    p.className = "dust-particle";
    const x = rect.left - boardRect.left + rect.width/2;
    const y = rect.top - boardRect.top + rect.height/2;
    p.style.left = x + "px";
    p.style.top = y + "px";
    const dx = (Math.random()-0.5)*120;
    const dy = -Math.random()*80 - 20;
    p.style.setProperty("--dx", dx+"px");
    p.style.setProperty("--dy", dy+"px");
    boardEl.appendChild(p);
    setTimeout(()=>p.remove(), 750);
  }
}

/* ---------- Quiz rendering ---------- */
function renderQuiz(container){
  if(!state.quiz) state.quiz = generateQuiz(state.lang);
  const q = state.quiz;

  if(q.questions.length === 0){
    container.innerHTML = `<div class="empty-state">Not enough content to build a quiz for this language yet.</div>`;
    return;
  }

  if(q.index >= q.questions.length){
    ensureLang(state.lang);
    const langProg = progress.langs[state.lang];
    container.innerHTML = `
      <div class="results-wrap">
        <div class="results-score">${q.score} / ${q.questions.length}</div>
        <div class="results-sub">Best score so far: ${langProg.bestScore} / ${q.questions.length}</div>
        <div class="results-actions">
          <button class="btn btn-blue" id="retryBtn">Try again</button>
          <button class="btn btn-ghost" id="backBtn">Back to lessons</button>
        </div>
      </div>
    `;
    if(q.score > langProg.bestScore){ langProg.bestScore = q.score; saveProgress(); }
    langProg.quizHistory.push({date:new Date().toISOString().slice(0,10), score:q.score, total:q.questions.length});
    saveProgress();
    touchStreak();

    document.getElementById("retryBtn").addEventListener("click", ()=>{
      state.quiz = generateQuiz(state.lang);
      render();
    });
    document.getElementById("backBtn").addEventListener("click", ()=>{
      state.tab = "vocabulary";
      state.quiz = null;
      render();
    });
    return;
  }

  const current = q.questions[q.index];
  container.innerHTML = `
    <div class="quiz-sub">Question ${q.index+1} of ${q.questions.length} · Score: ${q.score}</div>
    <div class="quiz-question">${current.term}</div>
    <div class="quiz-sub">${current.pron}</div>
    <div class="quiz-options">
      ${current.options.map((opt,i)=>`
        <button class="quiz-option" data-opt="${i}">${opt}</button>
      `).join('')}
    </div>
    <div class="quiz-footer">
      <button class="btn btn-blue" id="nextQBtn" style="display:none;">Next question &rarr;</button>
    </div>
  `;

  container.querySelectorAll(".quiz-option").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(q.answered) return;
      q.answered = true;
      const chosen = btn.textContent;
      const isCorrect = chosen === current.correct;
      if(isCorrect) q.score += 1;
      container.querySelectorAll(".quiz-option").forEach(b=>{
        b.disabled = true;
        if(b.textContent === current.correct) b.classList.add("correct");
        else if(b === btn && !isCorrect) b.classList.add("wrong");
      });
      document.getElementById("nextQBtn").style.display = "inline-block";
    });
  });

  document.getElementById("nextQBtn").addEventListener("click", ()=>{
    q.index += 1;
    q.answered = false;
    render();
  });
}

/* ============ INIT ============ */
render();

/* Register service worker for offline support + installability.
   Wrapped in a feature check so it never breaks the app in browsers
   or contexts (like some sandboxed viewers) that block it. */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(err => {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
</body>
</html>
